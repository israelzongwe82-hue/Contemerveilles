name: Construire ConteMerveilles APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'images/**'
      - 'audio/**'
      - 'audios/**'
      - 'sounds/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Construire l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Vérifier les fichiers nécessaires
        run: |
          test -f index.html || { echo 'ERREUR : index.html est introuvable à la racine du dépôt.'; exit 1; }
          test -f images/icon.png || { echo 'ERREUR : images/icon.png est introuvable.'; exit 1; }
          if [ ! -f images/splash.png ] && [ ! -f images/splash-screen.png ]; then
            echo 'ERREUR : place images/splash.png ou images/splash-screen.png dans le dossier images.'
            exit 1
          fi
          echo 'Fichiers HTML et images trouvés.'

      - name: Préparer le projet Node et Capacitor
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/android @capacitor/cli @capacitor/assets
          if [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.israelzongwe.contemerveilles",
            "appName": "ConteMerveilles",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON
          fi

      - name: Préparer les fichiers web
        run: |
          mkdir -p www
          cp index.html www/
          for file in style.css app.js manifest.json; do
            if [ -f "$file" ]; then cp "$file" www/; fi
          done
          for folder in images audio audios sounds; do
            if [ -d "$folder" ]; then cp -R "$folder" www/; fi
          done

      - name: Préparer les ressources de l'icône et du démarrage
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          Path("assets").mkdir(exist_ok=True)

          def contain_on_canvas(source, size, background):
              image = Image.open(source).convert("RGBA")
              image = ImageOps.contain(image, (size, size), method=Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), background)
              x = (size - image.width) // 2
              y = (size - image.height) // 2
              canvas.alpha_composite(image, (x, y))
              return canvas

          icon = contain_on_canvas("images/icon.png", 1024, (0, 0, 0, 0))
          icon.save("assets/icon-only.png")
          icon.save("assets/icon-foreground.png")
          Image.new("RGB", (1024, 1024), (7, 20, 38)).save("assets/icon-background.png")

          splash_source = "images/splash.png" if Path("images/splash.png").is_file() else "images/splash-screen.png"
          splash = contain_on_canvas(splash_source, 2732, (7, 20, 38, 255))
          splash.convert("RGB").save("assets/splash.png")
          print(f"Icône préparée depuis images/icon.png ; splash préparé depuis {splash_source}.")
          PY

      - name: Ajouter la plateforme Android si nécessaire
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Générer les icônes et l'écran de démarrage Android
        run: npx capacitor-assets generate --android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Construire l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ConteMerveilles-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
