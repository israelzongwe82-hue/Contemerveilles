name: Construire ConteMerveilles pour Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les outils Android nécessaires
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Préparer le projet Web
        run: |
          test -f index.html || (echo "ERREUR : index.html est introuvable à la racine du dépôt." && exit 1)
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          mkdir -p www
          cp index.html www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.israelzongwe.contemerveilles",
            "appName": "ConteMerveilles",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON

      - name: Créer le projet Android Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Construire l’APK Android
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l’APK à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: ConteMerveilles-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
