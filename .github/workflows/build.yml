name: Construire ConteMerveilles

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    name: Application Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les outils Android
        uses: android-actions/setup-android@v3

      - name: Installer Cordova
        run: npm install -g cordova

      - name: Préparer le projet Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          mkdir -p www/images
          cp -r images/* www/images/
          cordova create app com.contemerveilles.app ConteMerveilles
          cp -r www/* app/www/
          cd app
          cordova platform add android
          cordova plugin add cordova-plugin-whitelist || true
          cordova build android --release

      - name: Préparer l'APK
        run: |
          mkdir -p sortie
          cp app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk sortie/ConteMerveilles-Android.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ConteMerveilles-Android-APK
          path: sortie/ConteMerveilles-Android.apk

  windows:
    name: Application Windows EXE
    runs-on: windows-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --save-dev electron electron-builder

      - name: Créer les fichiers Windows
        shell: pwsh
        run: |
          @'
          {
            "name": "contemerveilles",
            "version": "1.0.0",
            "description": "ConteMerveilles",
            "main": "main.js",
            "scripts": {
              "build": "electron-builder --win portable"
            },
            "devDependencies": {
              "electron": "^41.0.0",
              "electron-builder": "^26.0.0"
            },
            "build": {
              "appId": "com.contemerveilles.app",
              "productName": "ConteMerveilles",
              "files": [
                "main.js",
                "index.html",
                "images/**/*"
              ],
              "win": {
                "target": "portable",
                "icon": "images/icon.png"
              }
            }
          }
          '@ | Set-Content -Encoding utf8 package.json

          @'
          const { app, BrowserWindow } = require("electron");
          const path = require("path");

          function createWindow() {
            const win = new BrowserWindow({
              width: 480,
              height: 850,
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            win.loadFile(path.join(__dirname, "index.html"));
          }

          app.whenReady().then(createWindow);

          app.on("window-all-closed", () => {
            if (process.platform !== "darwin") app.quit();
          });
          '@ | Set-Content -Encoding utf8 main.js

          npm install

      - name: Construire le fichier EXE
        run: npm run build

      - name: Publier le fichier EXE
        uses: actions/upload-artifact@v4
        with:
          name: ConteMerveilles-Windows-EXE
          path: dist/*.exe
