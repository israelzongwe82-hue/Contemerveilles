name: Build ConteMerveilles

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger les fichiers
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Cordova
        run: npm install --global cordova

      - name: Créer le projet Android
        run: |
          cordova create app com.contemerveilles.app ConteMerveilles
          cd app
          cordova platform add android

          cp ../index.html www/index.html
          cp -r ../images www/images

          mkdir -p resources
          cp ../images/icon.png resources/icon.png
          cp ../images/splash.png resources/splash.png

          npm install cordova-res --save-dev

          npx cordova-res android \
            --icon-source resources/icon.png \
            --splash-source resources/splash.png \
            --copy

          cordova build android

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ConteMerveilles-Android
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk

  windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Télécharger les fichiers
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Créer l'application Windows
        shell: pwsh
        run: |
          npm init -y
          npm install electron electron-builder --save-dev

          @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1000,
              height: 750,
              autoHideMenuBar: true,
              icon: path.join(__dirname, 'images', 'icon.png'),
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false
              }
            });

            win.loadFile('index.html');
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          '@ | Set-Content main.js

          npm pkg set name="contemerveilles"
          npm pkg set productName="ConteMerveilles"
          npm pkg set version="1.0.0"
          npm pkg set main="main.js"
          npm pkg set "scripts.dist=electron-builder --win nsis"

          @'
          {
            "appId": "com.contemerveilles.app",
            "productName": "ConteMerveilles",
            "files": [
              "main.js",
              "index.html",
              "images/**/*"
            ],
            "win": {
              "target": "nsis",
              "icon": "images/icon.png"
            }
          }
          '@ | Set-Content electron-builder.json

          npm run dist

      - name: Publier l'application Windows
        uses: actions/upload-artifact@v4
        with:
          name: ConteMerveilles-Windows
          path: dist/*.exe
